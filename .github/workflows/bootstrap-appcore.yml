name: Bootstrap AppCore

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download sanitized template artifact
        env:
          TEMPLATE_URL: "https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-9bf8-81f7-a9d9-a00b5076230e/raw?se=2026-08-01T14:46:58Z&sp=r&sv=2026-02-06&sr=b&scid=61401c89-ea3a-53fb-9dcf-85c7ffd64983&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T01:23:15Z&ske=2026-08-02T01:23:15Z&sks=b&skv=2026-02-06&sig=pEgsHFx1vr9QlVXW5xkvml03fH%2BSH6JDEzX5Qq25M1A%3D"
        run: |
          curl --fail --location "$TEMPLATE_URL" --output /tmp/appcore-template-artifact.zip
          mkdir -p /tmp/appcore-artifact /tmp/appcore-template
          unzip -q /tmp/appcore-template-artifact.zip -d /tmp/appcore-artifact
          tar -xzf /tmp/appcore-artifact/appcore-template.tar.gz -C /tmp/appcore-template

      - name: Publish reusable template
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/appcore-template/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initialize AppCore reusable application template"
          git push origin HEAD:main

      - name: Enable GitHub template repository mode
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --request PATCH \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            --data '{"is_template":true}'
