name: Bootstrap AppCore

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download sanitized template artifact
        env:
          TEMPLATE_URL: "https://sdmntprcacentral.oaiusercontent.com/files/00000000-6d50-820d-b495-e5b32e251224/raw?se=2026-08-01T14:49:18Z&sp=r&sv=2026-02-06&sr=b&scid=b50a58b7-122e-5092-b789-2ecbc9e6b07a&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T12:37:39Z&ske=2026-08-02T12:37:39Z&sks=b&skv=2026-02-06&sig=AmZZiGGvaIxMgmG00W4Pxxvzb4DOAnG1wECibgfgiag%3D"
        run: |
          curl --fail --location "$TEMPLATE_URL" --output /tmp/appcore-template-artifact.zip
          mkdir -p /tmp/appcore-artifact /tmp/appcore-template
          unzip -q /tmp/appcore-template-artifact.zip -d /tmp/appcore-artifact
          tar -xzf /tmp/appcore-artifact/appcore-template.tar.gz -C /tmp/appcore-template
          rm -f /tmp/appcore-template/.github/workflows/ci.yml

      - name: Publish reusable template
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/appcore-template/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initialize AppCore reusable application template"
          git push origin HEAD:main
