<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Open Shop OS 0.4.4</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#edf7ff}body{overflow:hidden}iframe{display:block}</style></head><body><iframe id="app" src="index.html?v=044"></iframe><script>const frame=document.getElementById('app');frame.addEventListener('load',()=>{const d=frame.contentDocument;const s=d.createElement('script');s.textContent=`(function(){const NS='openshop-demo-sitdevai-20260815-fixed';const BASE='https://mantledb.sh/v2/';const API=BASE+NS;const OWNER_KEY='os_owner_device_id';let ownerId=localStorage.getItem(OWNER_KEY);if(!ownerId){ownerId='dev-'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(OWNER_KEY,ownerId)}let timer=null;remoteStore='mantledb';try{VERSION='OS 0.4.4'}catch(e){};function setState(t){const e=document.getElementById('syncState');if(e)e.textContent=t}function normalizeWa(v){let x=String(v||'').trim().replace(/[^0-9+]/g,'');if(x.startsWith('+'))x=x.slice(1);if(x.startsWith('00'))x=x.slice(2);if(x.startsWith('0')&&x.length>=9)x='963'+x.slice(1);return x.replace(/\D/g,'')}function openWhatsApp(num){const n=normalizeWa(num);if(!n)return toast('رقم واتساب غير صالح');window.open('https://wa.me/'+n,'_blank','noopener,noreferrer')}window.openWhatsApp=openWhatsApp;async function serverPull(){try{const lr=await fetch(BASE+'list/'+NS+'?t='+Date.now(),{cache:'no-store'});if(!lr.ok)throw new Error('list '+lr.status);const list=await lr.json();const paths=(list.entries||[]).map(x=>x.path).filter(x=>x.startsWith('ads/'));const fresh=[];await Promise.all(paths.map(async p=>{try{const r=await fetch(BASE+NS+'/'+p+'?t='+Date.now(),{cache:'no-store'});if(r.ok){const a=await r.json();if(a&&a.id)fresh.push(a)}}catch(e){}}));fresh.sort((a,b)=>Number(b.id)-Number(a.id));ads=fresh;const el=document.getElementById('homeAds');if(el)el.innerHTML=adListHtml(ads);setState('متصل بالسيرفر — '+ads.length+' إعلان');return true}catch(e){console.error(e);setState('تعذر الاتصال بالسيرفر');return false}}ensureRemoteStore=async()=>API;pullAds=serverPull;pushAds=async()=>true;startSync=function(){clearInterval(timer);serverPull();timer=setInterval(serverPull,1500)};shareLink=function(){const url=parent.location.origin+parent.location.pathname;if(navigator.share)navigator.share({title:'Open Shop',text:'افتح Open Shop — نفس العروض تظهر عند الجميع',url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('تم نسخ الرابط'));else prompt('انسخ الرابط',url)};continueAsGuest=async function(){localStorage.setItem('lm_guest','1');guest=true;current='explore';render();startSync();toast('تم الدخول — المزامنة عبر السيرفر')};previewImage=function(e){const f=e.target.files&&e.target.files[0];if(!f)return;const img=new Image(),r=new FileReader();r.onload=()=>{img.onload=()=>{const max=260,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);pendingImage=c.toDataURL('image/jpeg',0.35);document.getElementById('uploadBox').innerHTML='<input id="adImage" type="file" accept="image/*" onchange="previewImage(event)"><img src="'+pendingImage+'" alt="معاينة صورة الإعلان">'};img.src=r.result};r.readAsDataURL(f)};adComposer=function(){return '<div class="sectionTitle">إضافة إعلان جديد</div><div class="panel glass" style="padding:16px;margin-bottom:18px"><div class="sectionTitle" style="font-size:20px">رفع صور الإعلان</div><label class="upload" id="uploadBox"><input id="adImage" type="file" accept="image/*" onchange="previewImage(event)"><span class="plus">＋</span></label><div class="field"><label>عنوان الإعلان</label><input id="adTitle" placeholder="مثال: هاتف سامسونج جديد"></div><div class="field"><label>السعر</label><div class="priceWrap"><input id="adPrice" type="number" min="0" inputmode="numeric" placeholder="أدخل السعر"><span class="currencyBadge">ل.س جديدة</span></div></div><div class="field"><label>رقم واتساب <span style="color:#ff4057">*</span></label><input id="adWhatsapp" type="tel" inputmode="tel" dir="ltr" placeholder="مثال: 09xxxxxxxx أو +9639xxxxxxxx"></div><div class="field"><label>الوصف</label><textarea id="adDesc" placeholder="تفاصيل المنتج، حالته، المواصفات..."></textarea></div><div class="stack"><button class="primary" onclick="publishAd()">تأكيد النشر</button><button class="secondary" onclick="clearAdForm()">إلغاء</button></div></div>'};publishAd=async function(){const title=document.getElementById('adTitle').value.trim(),price=document.getElementById('adPrice').value.trim(),whatsapp=document.getElementById('adWhatsapp').value.trim(),description=document.getElementById('adDesc').value.trim();if(!pendingImage)return toast('اختر صورة للإعلان');if(!title)return toast('اكتب عنوان الإعلان');if(!price||Number(price)<=0)return toast('أدخل السعر بالليرة السورية الجديدة');if(!whatsapp)return toast('رقم واتساب مطلوب');if(normalizeWa(whatsapp).length<8)return toast('أدخل رقم واتساب صحيح');if(!description)return toast('اكتب وصف الإعلان');const ad={id:Date.now(),owner:ownerId,title,price:Number(price),currency:'SYP',whatsapp,description,image:pendingImage,createdAt:new Date().toISOString()};try{const r=await fetch(API+'/ads/'+ad.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(ad)});if(!r.ok)throw new Error('write '+r.status);pendingImage='';await serverPull();current='ads';render();toast('تم نشر الإعلان على السيرفر')}catch(e){console.error(e);toast('فشل رفع الإعلان إلى السيرفر')}};deleteAd=async function(id){const ad=ads.find(a=>Number(a.id)===Number(id));if(ad&&ad.owner&&ad.owner!==ownerId)return toast('لا يمكنك حذف إعلان جهاز آخر');if(!confirm('هل تريد حذف الإعلان؟'))return;try{const r=await fetch(API+'/ads/'+id,{method:'DELETE'});if(!r.ok&&r.status!==404)throw new Error('delete '+r.status);await serverPull();render();toast('تم حذف الإعلان')}catch(e){toast('تعذر حذف الإعلان')}};window.showAdDetails=function(id){const a=ads.find(x=>Number(x.id)===Number(id));if(!a)return toast('الإعلان غير موجود');const mine=a.owner===ownerId;const wrap=d.createElement('div');wrap.id='adDetailsOverlay';wrap.style.cssText='position:fixed;z-index:999;inset:0;background:rgba(4,10,22,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px';wrap.innerHTML='<div class="glass" style="width:min(100%,560px);max-height:88vh;overflow:auto;padding:16px;background:var(--panel2)"><button class="secondary" style="padding:8px 12px;float:left" onclick="document.getElementById(\'adDetailsOverlay\').remove()">✕</button><img src="'+esc(a.image)+'" style="width:100%;max-height:300px;object-fit:cover;border-radius:20px;margin-bottom:14px"><h2 style="margin:0 0 8px">'+esc(a.title)+'</h2><div style="font-weight:900;font-size:20px;margin-bottom:10px">'+Number(a.price||0).toLocaleString('ar-SY')+' ل.س جديدة</div><p style="line-height:1.8;white-space:pre-wrap">'+esc(a.description||'')+'</p>'+(a.whatsapp?'<button class="primary" style="width:100%;margin-top:10px" onclick="openWhatsApp(\''+esc(a.whatsapp).replace(/'/g,'&#39;')+'\')">واتساب: '+esc(a.whatsapp)+'</button>':'<div style="opacity:.65">لا يوجد رقم واتساب لهذا الإعلان القديم</div>')+(mine?'<button class="danger" style="width:100%;margin-top:10px" onclick="deleteAd('+Number(a.id)+');document.getElementById(\'adDetailsOverlay\')?.remove()">حذف الإعلان</button>':'')+'</div>';wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove()});d.body.appendChild(wrap)};adListHtml=function(list){return list.length?'<div class="stack">'+list.map(a=>'<div class="adRow" style="cursor:pointer" onclick="showAdDetails('+Number(a.id)+')"><img src="'+esc(a.image)+'" alt=""><div class="meta"><b>'+esc(a.title)+'</b><span>'+esc(a.description)+'</span>'+(a.price?'<span style="font-weight:800;color:var(--ink)">'+Number(a.price).toLocaleString('ar-SY')+' ل.س جديدة</span>':'')+(a.whatsapp?'<span dir="ltr" style="color:#1f8f4a;font-weight:800" onclick="event.stopPropagation();openWhatsApp(\''+esc(a.whatsapp).replace(/'/g,'&#39;')+'\')">WhatsApp: '+esc(a.whatsapp)+'</span>':'')+'</div><span style="font-size:20px;opacity:.55">‹</span></div>').join('')+'</div>':'<div class="emptyBox glass"><div><b>لا توجد عروض حتى الآن</b><div class="bag">▱</div></div></div>'};adsView=function(){const mine=ads.filter(a=>a.owner===ownerId);root.innerHTML='<section class="screen">'+hero()+adComposer()+(mine.length?'<div class="sectionTitle">إعلاناتي المنشورة</div><div class="stack">'+mine.map(a=>'<div class="adRow"><img src="'+esc(a.image)+'" alt=""><div class="meta" onclick="showAdDetails('+Number(a.id)+')"><b>'+esc(a.title)+'</b><span>'+Number(a.price||0).toLocaleString('ar-SY')+' ل.س جديدة</span></div><button class="miniBtn" onclick="deleteAd('+Number(a.id)+')">🗑️ حذف</button></div>').join('')+'</div>':'')+'</section>'};const oldExplore=exploreView;exploreView=function(){oldExplore();const badge=document.querySelector('[style*="font-size:12px"]');if(badge){badge.id='syncState';badge.textContent='جارٍ الاتصال بالسيرفر...'}};if(guest){render();startSync()}})();`;d.body.appendChild(s)});</script></body></html>
