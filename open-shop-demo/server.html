<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Open Shop Server Sync</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#edf7ff}body{overflow:hidden}iframe{display:block}</style></head><body><iframe id="app" src="index.html?v=042-server"></iframe><script>const frame=document.getElementById('app');frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;const s=d.createElement('script');s.textContent=`(function(){const NS='openshop-demo-sitdevai-20260815-a7f3';const API='https://mantledb.sh/v2/'+NS;let timer=null;VERSION='OS 0.4.2 Server Sync';remoteStore='mantledb';function setState(t){const e=document.getElementById('syncState');if(e)e.textContent=t}async function serverPull(){try{const lr=await fetch('https://mantledb.sh/v2/list/'+NS+'?t='+Date.now(),{cache:'no-store'});if(!lr.ok)throw new Error('list');const list=await lr.json();const paths=(list.entries||[]).map(x=>x.path).filter(x=>x.startsWith('ads/'));const fresh=[];await Promise.all(paths.map(async p=>{try{const r=await fetch('https://mantledb.sh/v2/'+NS+'/'+p+'?t='+Date.now(),{cache:'no-store'});if(r.ok){const a=await r.json();if(a&&a.id)fresh.push(a)}}catch(e){}}));fresh.sort((a,b)=>Number(b.id)-Number(a.id));ads=fresh;const el=document.getElementById('homeAds');if(el)el.innerHTML=adListHtml(ads);setState('متصل بالسيرفر — '+ads.length+' إعلان');return true}catch(e){setState('تعذر الاتصال بالسيرفر');return false}}ensureRemoteStore=async()=>API;pullAds=serverPull;pushAds=async function(){return true};startSync=function(){clearInterval(timer);serverPull();timer=setInterval(serverPull,1500)};shareLink=function(){const url=parent.location.origin+parent.location.pathname;if(navigator.share)navigator.share({title:'Open Shop',text:'افتح Open Shop — نفس العروض تظهر عند الجميع',url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('تم نسخ الرابط'));else prompt('انسخ الرابط',url)};continueAsGuest=async function(){localStorage.setItem('lm_guest','1');guest=true;current='explore';render();startSync();toast('تم الدخول — المزامنة عبر السيرفر')};previewImage=function(e){const f=e.target.files&&e.target.files[0];if(!f)return;const img=new Image(),r=new FileReader();r.onload=()=>{img.onload=()=>{const max=300,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);pendingImage=c.toDataURL('image/jpeg',0.4);document.getElementById('uploadBox').innerHTML='<input id="adImage" type="file" accept="image/*" onchange="previewImage(event)"><img src="'+pendingImage+'" alt="معاينة صورة الإعلان">'};img.src=r.result};r.readAsDataURL(f)};publishAd=async function(){const title=document.getElementById('adTitle').value.trim(),price=document.getElementById('adPrice').value.trim(),description=document.getElementById('adDesc').value.trim();if(!pendingImage)return toast('اختر صورة للإعلان');if(!title)return toast('اكتب عنوان الإعلان');if(!price||Number(price)<=0)return toast('أدخل السعر بالليرة السورية الجديدة');if(!description)return toast('اكتب وصف الإعلان');const ad={id:Date.now(),title,price:Number(price),currency:'SYP',description,image:pendingImage,createdAt:new Date().toISOString()};try{const r=await fetch(API+'/ads/'+ad.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(ad)});if(!r.ok)throw new Error(String(r.status));pendingImage='';await serverPull();current='ads';render();toast('تم نشر الإعلان على السيرفر')}catch(e){toast('فشل رفع الإعلان إلى السيرفر')}};deleteAd=async function(id){try{const r=await fetch(API+'/ads/'+id,{method:'DELETE'});if(!r.ok&&r.status!==404)throw new Error();await serverPull();render();toast('تم حذف الإعلان')}catch(e){toast('تعذر حذف الإعلان')}};const oldExplore=exploreView;exploreView=function(){oldExplore();const badge=document.querySelector('[style*="font-size:12px"]');if(badge){badge.id='syncState';badge.textContent='جارٍ الاتصال بالسيرفر...'}};if(guest){render();startSync()}})();`;d.body.appendChild(s)});</script></body></html>
