<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#edf7ff">
<title>Open Shop</title>
<style>
:root{--bg:#edf7ff;--panel:rgba(255,255,255,.64);--panel2:rgba(255,255,255,.78);--ink:#0b1b2b;--muted:#678;--line:rgba(255,255,255,.72);--shadow:0 12px 34px rgba(30,80,120,.12);--accent:#137cff;--danger:#ff4057;--safe:#34c759;--bottom:rgba(255,255,255,.88)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--panel:rgba(20,27,45,.72);--panel2:rgba(17,24,39,.88);--ink:#f3f7ff;--muted:#a8b4c5;--line:rgba(255,255,255,.1);--shadow:0 12px 30px rgba(0,0,0,.25);--bottom:rgba(15,21,35,.94)}}
html[data-theme="light"]{--bg:#edf7ff;--panel:rgba(255,255,255,.64);--panel2:rgba(255,255,255,.78);--ink:#0b1b2b;--muted:#678;--line:rgba(255,255,255,.72);--shadow:0 12px 34px rgba(30,80,120,.12);--bottom:rgba(255,255,255,.88)}
html[data-theme="dark"]{--bg:#0b1020;--panel:rgba(20,27,45,.72);--panel2:rgba(17,24,39,.88);--ink:#f3f7ff;--muted:#a8b4c5;--line:rgba(255,255,255,.1);--shadow:0 12px 30px rgba(0,0,0,.25);--bottom:rgba(15,21,35,.94)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:radial-gradient(circle at 12% 5%,#d9f3ff 0,transparent 30%),radial-gradient(circle at 88% 22%,#e7ddff 0,transparent 28%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100%}body{overflow-x:hidden}.app{min-height:100vh;padding-bottom:104px}.screen{padding:18px 16px 24px;max-width:560px;margin:auto}.glass{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:26px}.hero{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;margin-bottom:18px}.heroText .appName{font-weight:900;font-size:26px;letter-spacing:-.5px}.hero h1{margin:4px 0 2px;font-size:24px}.hero p{margin:0;color:var(--muted)}.logoMark{width:58px;height:58px;border-radius:19px;background:linear-gradient(135deg,#1f8fff,#6a5cff);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 24px rgba(31,143,255,.25);position:relative}.logoMark:before,.logoMark:after{content:"";position:absolute;border-radius:50%;background:white}.logoMark:before{width:14px;height:14px;left:13px;top:14px}.logoMark:after{width:22px;height:22px;right:10px;bottom:10px;opacity:.9}.panel{padding:16px;margin-bottom:18px}.search{display:flex;align-items:center;padding:4px 12px;margin-bottom:16px;border-radius:20px;background:var(--panel2)}.search input{flex:1;border:0;background:transparent;color:var(--ink);font-size:16px;padding:12px;outline:none}.searchIcon{font-size:24px;opacity:.65}.sectionTitle{font-weight:900;font-size:22px;margin:4px 2px 14px}.emptyBox{min-height:210px;display:grid;place-items:center;text-align:center;color:var(--muted);background:var(--panel2)}.emptyBox b{display:block;color:var(--ink);margin-bottom:16px}.bag{font-size:54px;opacity:.25}.stack{display:grid;gap:12px}.adRow{display:flex;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:10px}.adRow img{width:82px;height:82px;object-fit:cover;border-radius:16px;background:#ccd}.adRow .meta{flex:1;min-width:0}.adRow b{display:block;font-size:17px;margin-bottom:3px}.adRow span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.field{display:grid;gap:7px;margin-bottom:13px}.field label{font-weight:800}.field input,.field textarea,.themeSelect{width:100%;border:1px solid rgba(120,140,170,.2);background:var(--panel2);color:var(--ink);border-radius:18px;padding:14px;font-size:16px;outline:none}.field textarea{min-height:110px;resize:vertical}.priceWrap{display:flex;gap:8px;align-items:center}.priceWrap input{flex:1}.currencyBadge{white-space:nowrap;font-weight:800;background:var(--panel2);padding:12px;border-radius:15px}.upload{display:grid;place-items:center;min-height:170px;border:1.5px dashed rgba(80,120,160,.35);border-radius:22px;background:var(--panel2);overflow:hidden;margin-bottom:15px}.upload img{width:100%;height:220px;object-fit:cover}.upload input{display:none}.plus{font-size:48px;opacity:.55}.primary,.secondary,.danger,.guestBtn,.miniBtn{border:0;border-radius:18px;padding:14px 16px;font-size:16px;font-weight:900;cursor:pointer}.primary,.guestBtn{background:linear-gradient(135deg,#137cff,#6b5cff);color:white;box-shadow:0 10px 22px rgba(19,124,255,.24)}.secondary{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}.danger{background:#ff4057;color:white}.miniBtn{padding:10px;background:rgba(255,64,87,.12);color:#ff4057}.login-screen{min-height:88vh;display:grid;place-items:center;align-content:center;gap:18px}.login-card{padding:24px;width:min(100%,390px);text-align:center}.login-card h1{font-size:30px;margin:4px}.login-card p{color:var(--muted)}.guestBtn{width:100%;margin-top:16px}.guest-note{font-size:12px;color:var(--muted);margin-top:10px}.profilePhotoPicker{width:108px;height:108px;border-radius:50%;margin:10px auto 18px;background:var(--panel2);display:grid;place-items:center;font-size:46px;overflow:hidden;position:relative}.profilePhotoPicker input{position:absolute;inset:0;opacity:0}.profilePhotoPicker img,.avatar{width:100%;height:100%;object-fit:cover}.profileForm,.profileActions{display:grid;gap:10px}.profileCard{display:flex;gap:14px;align-items:center;padding:14px;margin-bottom:14px}.profileCard .avatar{width:76px;height:76px;border-radius:50%;background:var(--panel2)}.profileData h2{margin:0 0 6px}.profileData div{color:var(--muted);font-size:14px}.themeControl{display:flex;align-items:center;gap:12px;padding:14px;margin-top:16px}.themeText{flex:1}.themeText b{display:block}.themeText small{color:var(--muted)}.themeSelect{width:auto;min-width:112px}.aboutPanel{min-height:70vh;display:grid;place-items:center;padding:24px}.aboutInfo{text-align:center;line-height:2.2}.aboutInfo .dev{display:block;font-weight:900;font-size:20px}.bottom{position:fixed;z-index:50;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 18px),560px);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 5px;border-radius:28px;background:var(--bottom);box-shadow:0 12px 34px rgba(0,0,0,.16);overflow:hidden}.nav{border:0;background:transparent;color:var(--muted);display:grid;place-items:center;gap:3px;padding:7px 2px;font-size:11px;font-weight:800;min-width:0}.nav .ic{font-size:22px;line-height:1}.nav.active{color:var(--accent)}.toast{position:fixed;z-index:99;left:50%;bottom:105px;transform:translate(-50%,18px);background:#101827;color:white;padding:11px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.18s ease;white-space:nowrap;max-width:90vw}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes osEnterForward{from{transform:translate3d(9px,0,0)}to{transform:translate3d(0,0,0)}}@keyframes osEnterBack{from{transform:translate3d(-9px,0,0)}to{transform:translate3d(0,0,0)}}.os-enter-forward{animation:osEnterForward 150ms cubic-bezier(.2,.75,.25,1)}.os-enter-back{animation:osEnterBack 150ms cubic-bezier(.2,.75,.25,1)}@media(prefers-reduced-motion:reduce){.os-enter-forward,.os-enter-back{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div class="app"><main id="root"></main><div id="bottomMount"></div><div id="toast" class="toast"></div></div>
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<script>
const VERSION='OS 0.4.1 Live Sync';
const FIRST_RELEASE='2026 / 8 / 14';
const DEVELOPER='Karam Hamdan';
const root=document.getElementById('root');
const bottomMount=document.getElementById('bottomMount');
let guest=localStorage.getItem('lm_guest')==='1';
let profile=JSON.parse(localStorage.getItem('lm_profile')||'null');
let ads=[];
const adsById=new Map();
const gun=Gun({peers:['https://gunjs.herokuapp.com/gun','https://gun-manhattan.herokuapp.com/gun','https://gun-us.herokuapp.com/gun'],localStorage:true});
const adsRef=gun.get('open-shop-public-demo').get('ads');
let syncStarted=false;
let current='explore';
let pendingImage='';
let pendingProfileImage=profile?.picture||'';
let themePreference=localStorage.getItem('os_theme')||'system';
function systemIsDark(){return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches}
function applyTheme(pref=themePreference){themePreference=pref;const rootEl=document.documentElement;if(pref==='system')rootEl.removeAttribute('data-theme');else rootEl.setAttribute('data-theme',pref);const dark=pref==='dark'||(pref==='system'&&systemIsDark());document.querySelector('meta[name=theme-color]')?.setAttribute('content',dark?'#0b1020':'#edf7ff')}
function setTheme(pref){localStorage.setItem('os_theme',pref);applyTheme(pref);const label={system:'النظام',light:'فاتح',dark:'داكن'}[pref]||pref;toast('المظهر: '+label)}
function themeControlHtml(){return `<div class="themeControl glass"><div class="themeText"><b>مظهر التطبيق</b><small>الافتراضي يتبع مظهر الهاتف تلقائيًا</small></div><select class="themeSelect" onchange="setTheme(this.value)"><option value="system" ${themePreference==='system'?'selected':''}>النظام</option><option value="light" ${themePreference==='light'?'selected':''}>فاتح</option><option value="dark" ${themePreference==='dark'?'selected':''}>داكن</option></select></div>`}
applyTheme(themePreference);
if(window.matchMedia){window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(themePreference==='system')applyTheme('system')})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
async function continueAsGuest(){localStorage.setItem('lm_guest','1');guest=true;current='explore';startSync();render();toast('تم الدخول كضيف — المزامنة مباشرة')}
function logout(){localStorage.removeItem('lm_guest');guest=false;current='explore';render()}
function nav(page){if(page===current||nav.busy)return;const order={buy:0,explore:1,ads:2,about:3,account:4};const dir=(order[page]??1)>=(order[current]??1)?'forward':'back';nav.busy=true;current=page;render();window.scrollTo(0,0);root.classList.remove('os-enter-forward','os-enter-back');void root.offsetWidth;root.classList.add(dir==='forward'?'os-enter-forward':'os-enter-back');const done=()=>{root.classList.remove('os-enter-forward','os-enter-back');nav.busy=false};root.addEventListener('animationend',done,{once:true});setTimeout(()=>{if(nav.busy)done()},190)}
function startSync(){if(syncStarted)return;syncStarted=true;adsRef.map().on((data,key)=>{if(!data){adsById.delete(key)}else{const ad={...data,id:Number(data.id||key)};adsById.set(String(key),ad)}ads=[...adsById.values()].sort((a,b)=>Number(b.id)-Number(a.id));if(guest&&current==='explore'){const el=document.getElementById('homeAds');if(el)el.innerHTML=adListHtml(ads)}})}
function shareLink(){const url=location.origin+location.pathname;if(navigator.share)navigator.share({title:'Open Shop',text:'افتح Open Shop — نفس العروض تظهر عند الجميع مباشرة',url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('تم نسخ رابط Open Shop'));else prompt('انسخ الرابط وأرسله لرفيقك',url)}
function putAdLive(ad){return new Promise(resolve=>{adsRef.get(String(ad.id)).put(ad,ack=>resolve(!ack?.err));setTimeout(()=>resolve(true),1800)})}
function deleteAdLive(id){return new Promise(resolve=>{adsRef.get(String(id)).put(null,ack=>resolve(!ack?.err));setTimeout(()=>resolve(true),1800)})}
function hero(){return `<div class="hero glass"><div class="heroText"><div class="appName">Open Shop</div><h1>مرحبًا بك</h1><p>منصتك الموثوقة للشراء والبيع</p></div><div class="logoMark"></div></div>`}
function bottom(){return `<nav class="bottom glass" style="--active-index:1"><button class="nav" data-page="buy" onclick="nav('buy')"><span class="ic">🛍️</span>شراء</button><button class="nav" data-page="explore" onclick="nav('explore')"><span class="ic">🧭</span>استكشاف</button><button class="nav" data-page="ads" onclick="nav('ads')"><span class="ic">☷</span>إعلاناتي</button><button class="nav" data-page="about" onclick="nav('about')"><span class="ic">ⓘ</span>عن تطبيقنا</button><button class="nav" data-page="account" onclick="nav('account')"><span class="ic">👤</span>معلومات حسابي</button></nav>`}
function syncBottom(){if(!guest){bottomMount.innerHTML='';return}if(!bottomMount.firstElementChild)bottomMount.innerHTML=bottom();const idx={buy:0,explore:1,ads:2,about:3,account:4}[current]??1;const bar=bottomMount.firstElementChild;bar.style.setProperty('--active-index',idx);bar.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===current))}
function loginView(){root.innerHTML=`<section class="screen"><div class="login-screen"><div class="logoMark"></div><div class="appName">Open Shop</div><div class="login-card glass"><h1>مرحبًا بك</h1><p>تابع إلى النسخة الأولى</p><button class="guestBtn" onclick="continueAsGuest()">Confirm As A Guest</button><div class="guest-note">الدخول كضيف متاح في النسخة الأولى فقط.</div></div></div></section>`}
function adListHtml(list){return list.length?`<div class="stack">${list.map(a=>`<div class="adRow"><img src="${esc(a.image)}" alt=""><div class="meta"><b>${esc(a.title)}</b><span>${esc(a.description)}</span>${a.price?`<span style="font-weight:800;color:var(--ink)">${Number(a.price).toLocaleString('ar-SY')} ل.س جديدة</span>`:''}</div></div>`).join('')}</div>`:`<div class="emptyBox glass"><div><b>لا توجد عروض حتى الآن</b><div class="bag">▱</div></div></div>`}
function exploreView(){root.innerHTML=`<section class="screen">${hero()}<div class="panel glass"><div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><button class="secondary" style="margin:0;flex:1" onclick="shareLink()">مشاركة الرابط</button><span style="font-size:12px;opacity:.7">مزامنة مباشرة</span></div><div class="search glass"><input id="q" placeholder="ابحث عن عروض..." oninput="renderSearch()"><span class="searchIcon">⌕</span></div><div class="sectionTitle">كل العروض المعروضة</div><div id="homeAds">${adListHtml(ads)}</div></div></section>`}
function buyView(){root.innerHTML=`<section class="screen">${hero()}<div class="panel glass"><div class="sectionTitle">الشراء</div><div class="emptyBox glass"><div><b>لا توجد مشتريات حتى الآن</b><div class="bag">🛍️</div></div></div></div></section>`}
function renderSearch(){const q=(document.getElementById('q')?.value||'').trim().toLowerCase();const list=!q?ads:ads.filter(a=>(a.title+' '+a.description).toLowerCase().includes(q));document.getElementById('homeAds').innerHTML=adListHtml(list)}
function adComposer(){return `<div class="sectionTitle">إضافة إعلان جديد</div><div class="panel glass" style="padding:16px;margin-bottom:18px"><div class="sectionTitle" style="font-size:20px">رفع صور الإعلان</div><label class="upload" id="uploadBox"><input id="adImage" type="file" accept="image/*" onchange="previewImage(event)"><span class="plus">＋</span></label><div class="field"><label>عنوان الإعلان</label><input id="adTitle" placeholder="مثال: هاتف سامسونج جديد"></div><div class="field"><label>السعر</label><div class="priceWrap"><input id="adPrice" type="number" min="0" inputmode="numeric" placeholder="أدخل السعر"><span class="currencyBadge">ل.س جديدة</span></div></div><div class="field"><label>الوصف</label><textarea id="adDesc" placeholder="تفاصيل المنتج، حالته، المواصفات..."></textarea></div><div class="stack"><button class="primary" onclick="publishAd()">تأكيد النشر</button><button class="secondary" onclick="clearAdForm()">إلغاء</button></div></div>`}
function clearAdForm(){pendingImage='';render();toast('تم إلغاء الإدخال')}
function previewImage(e){const f=e.target.files?.[0];if(!f)return;const img=new Image();const r=new FileReader();r.onload=()=>{img.onload=()=>{const max=420,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);pendingImage=c.toDataURL('image/jpeg',0.55);document.getElementById('uploadBox').innerHTML=`<input id="adImage" type="file" accept="image/*" onchange="previewImage(event)"><img src="${pendingImage}" alt="معاينة صورة الإعلان">`};img.src=r.result};r.readAsDataURL(f)}
async function publishAd(){const title=document.getElementById('adTitle').value.trim(),price=document.getElementById('adPrice').value.trim(),description=document.getElementById('adDesc').value.trim();if(!pendingImage)return toast('اختر صورة للإعلان');if(!title)return toast('اكتب عنوان الإعلان');if(!price||Number(price)<=0)return toast('أدخل السعر بالليرة السورية الجديدة');if(!description)return toast('اكتب وصف الإعلان');const ad={id:Date.now(),title,price:Number(price),currency:'SYP',description,image:pendingImage,createdAt:new Date().toISOString()};pendingImage='';adsById.set(String(ad.id),ad);ads=[...adsById.values()].sort((a,b)=>Number(b.id)-Number(a.id));const ok=await putAdLive(ad);current='ads';render();toast(ok?'تم نشر الإعلان مباشرة':'تم النشر محليًا وسيحاول التطبيق مزامنته')}
function adsView(){root.innerHTML=`<section class="screen">${hero()}${adComposer()}</section>`}
function myAdsHtml(list){return list.length?`<div class="stack">${list.map(a=>`<div class="adRow"><img src="${esc(a.image)}" alt=""><div class="meta"><b>${esc(a.title)}</b><span>${esc(a.description)}</span></div><button class="miniBtn" onclick="deleteAd(${a.id})">🗑️</button></div>`).join('')}</div>`:`<div class="emptyBox glass"><div><b>لا توجد إعلانات منشورة</b><div class="bag">▱</div></div></div>`}
async function deleteAd(id){adsById.delete(String(id));ads=[...adsById.values()];await deleteAdLive(id);render();toast('تم حذف الإعلان')}
function aboutView(){root.innerHTML=`<section class="screen"><div class="aboutPanel glass"><div class="aboutInfo"><div>تاريخ أول نسخة: ${FIRST_RELEASE}</div><span class="dev">The Developer: ${DEVELOPER}</span><div>النسخة الحالية: ${VERSION}</div></div></div></section>`}
function profileImageHtml(){return pendingProfileImage?`<img src="${esc(pendingProfileImage)}" alt="صورة الحساب">`:'👤'}
function previewProfileImage(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{pendingProfileImage=r.result;document.getElementById('profilePhoto').innerHTML=`<input type="file" accept="image/*" onchange="previewProfileImage(event)"><img src="${esc(pendingProfileImage)}" alt="صورة الحساب">`};r.readAsDataURL(f)}
function saveProfile(){const name=document.getElementById('profileName').value.trim();const email=document.getElementById('profileEmail').value.trim();const phone=document.getElementById('profilePhone').value.trim();if(!name)return toast('اكتب الاسم');if(!email)return toast('اكتب البريد الإلكتروني');profile={name,email,phone,picture:pendingProfileImage};localStorage.setItem('lm_profile',JSON.stringify(profile));render();toast('تم إنشاء الحساب')}
function editProfile(){profile=null;render()}
function accountView(){if(!profile){root.innerHTML=`<section class="screen">${hero()}<div class="panel glass"><div class="sectionTitle">إنشاء حسابي</div><div id="profilePhoto" class="profilePhotoPicker"><input type="file" accept="image/*" onchange="previewProfileImage(event)">${profileImageHtml()}</div><div class="profileForm"><div class="field"><label>الاسم الكامل</label><input id="profileName" placeholder="أدخل اسمك"></div><div class="field"><label>البريد الإلكتروني</label><input id="profileEmail" type="email" placeholder="example@email.com" dir="ltr"></div><div class="field"><label>رقم الهاتف</label><input id="profilePhone" type="tel" placeholder="رقم الهاتف" dir="ltr"></div></div><div class="profileActions"><button class="primary" onclick="saveProfile()">إنشاء الحساب</button><button class="secondary" onclick="nav('explore')">إلغاء</button></div>${themeControlHtml()}</div></section>`;return}const pic=profile.picture?`<img class="avatar" src="${esc(profile.picture)}" alt="صورة الحساب">`:`<div class="avatar" style="display:grid;place-items:center;font-size:45px">👤</div>`;root.innerHTML=`<section class="screen">${hero()}<div class="panel glass"><div class="sectionTitle">معلومات حسابي</div><div class="profileCard glass">${pic}<div class="profileData"><h2>${esc(profile.name)}</h2><div dir="ltr">${esc(profile.email)}</div>${profile.phone?`<div dir="ltr">${esc(profile.phone)}</div>`:''}</div></div><div class="profileActions"><button class="secondary" onclick="editProfile()">تعديل المعلومات</button><button class="danger" onclick="logout()">تسجيل الخروج</button></div>${themeControlHtml()}</div></section>`}
function render(){if(!guest){syncBottom();return loginView()}syncBottom();({explore:exploreView,buy:buyView,ads:adsView,about:aboutView,account:accountView}[current]||exploreView)();syncBottom()}
(()=>{startSync();render()})();
</script>
</body>
</html>
